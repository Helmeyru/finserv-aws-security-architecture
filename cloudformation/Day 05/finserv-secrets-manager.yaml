AWSTemplateFormatVersion: "2010-09-09"

Description: FinServ Secure Application Credentials

Resources:
  FinServAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: finserv/security-lab/app-credentials
      Description: Synthetic credentials for Manara Project 8

      KmsKeyId: alias/finserv-security-lab-data

      GenerateSecretString:
        SecretStringTemplate: '{"username":"finserv_lab_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: false

      Tags:
        - Key: Project
          Value: Manara-SAA-P8
        - Key: Environment
          Value: Lab
